version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_TOKEN}}

updates:
- package-ecosystem: "npm"
  directory: "/"
  registries:
    - npm-github
  open-pull-requests-limit: 10
  schedule:
    interval: "monthly"
    time: "02:00"
  cooldown:
    default-days: 3
  ignore:
    - dependency-name: "@types/node"
      update-types:
        - version-update:semver-major
  groups:
    codeql-actions:
      patterns:
        - "github/codeql-action/*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
    time: "02:00"
  cooldown:
    default-days: 3
